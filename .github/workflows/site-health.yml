name: Scheduled production health

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-production-health
  cancel-in-progress: true

jobs:
  production-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build reviewed route contract
        run: SITE_URL=https://independentobserver.org BASE_PATH=/ npm run build
      - name: Crawl production contract
        env:
          SITE_URL: https://independentobserver.org
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: npm run verify:production
