name: Sync approved Dropbox website feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dropbox-feed-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DROPBOX_SOURCE_PATH: /Independent Observer desktop/Website Feed/approved
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate approved Dropbox manifest and sources
        run: node scripts/sync-dropbox-public-feed.mjs

      - name: Check for generated data changes
        id: changes
        run: |
          if git diff --quiet -- src/data/dropbox-content.generated.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create review branch and pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: automation/dropbox-feed-${{ github.run_id }}
        run: |
          git config user.name "independent-observer-automation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- src/data/dropbox-content.generated.ts
          git commit -m "Sync approved Dropbox website feed"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Sync approved Dropbox website feed" \
            --body "This automated PR contains only structured items from the exact approved Dropbox website-feed manifest. The workflow never copies raw Dropbox artifacts into the public build. CI must pass and a human review is required before merge or deployment."

      - name: Report unchanged feed
        if: steps.changes.outputs.changed == 'false'
        run: echo "Approved Dropbox website feed is unchanged; no pull request created."
