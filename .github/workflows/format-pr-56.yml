name: Format PR 56

on:
  push:
    branches:
      - ux/navigation-growth-funnel-2026-09-13

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/focused-usability.spec.ts src/components/FollowUpdates.astro src/pages/index.astro src/pages/join/index.astro src/pages/latest/index.astro src/pages/whats-new/index.astro
          git commit -m "style: format navigation growth funnel"
          git push origin HEAD:ux/navigation-growth-funnel-2026-09-13
