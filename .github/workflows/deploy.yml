name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: Deploy the current main branch to GitHub Pages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_deployment == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry_2.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build GitHub Pages artifact
        run: npm run build:pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # GitHub Pages can return transient 503s during platform incidents.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before deployment retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Retry Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before second deployment retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 15

      - name: Retry Pages deployment again
        id: deployment_retry_2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Fail if Pages deployment did not succeed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' && steps.deployment_retry_2.outcome == 'failure'
        run: exit 1
