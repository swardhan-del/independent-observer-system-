name: Continuous integration

on:
  pull_request:
    branches: [main, build/interactive-publication-v1]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify hosted publication operating system
        run: npm run verify:operating-system
      - name: Verify publication manifest contract
        run: npx vitest run scripts/publication-manifest.test.mjs scripts/sync-dropbox-public-feed.test.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit build and test dependencies
        run: npm audit --audit-level=moderate
      - name: Reject unmanaged Dropbox feed edits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- src/data/dropbox-content.generated.ts; then
            exit 0
          fi
          case "$HEAD_REF" in
            automation/dropbox-feed-*) ;;
            *)
              echo "Dropbox generated data may only change on a sync-generated PR."
              exit 1
              ;;
          esac
      - name: Check formatting
        run: npm run format:check
      - name: Lint and type-check
        run: npm run lint
      - name: Test normal production output
        run: npm test
      - name: Check reader performance budgets
        run: npm run perf:check
      - name: Install browser for reader journey tests
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Playwright browser installation failed after 3 attempts."
              exit 1
            fi
            echo "Playwright browser installation failed on attempt $attempt; retrying in 10 seconds."
            sleep 10
          done
      - name: Test desktop and mobile reader journeys
        run: npm run test:e2e
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-journey-results
          path: test-results/
          retention-days: 7
      - name: Build GitHub Pages output
        run: npm run build:pages
      - name: Test GitHub Pages output
        run: npm run test:built
      - name: Verify GitHub Pages fallback boundary
        run: npm run verify:pages-fallback
      - name: Build approved public-origin output
        run: SITE_URL=https://independentobserver.org BASE_PATH=/ npm run build
      - name: Block non-canonical hosts in generated production metadata
        run: CANONICAL_ORIGIN=https://independentobserver.org npm run verify:canonical-origin
      - name: Generate production SEO growth report
        run: npm run seo:report
      - name: Preserve SEO growth report
        if: always() && hashFiles('seo-reports/latest.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seo-growth-report
          path: seo-reports/latest.json
          retention-days: 30
      - name: Verify Vercel preview indexing boundary
        run: VERCEL_ENV=preview SITE_URL=https://independentobserver.org BASE_PATH=/ npm run build && npm run verify:preview-indexing
      - name: Run SEO audit
        run: SEO_SITE_URL=https://independentobserver.org npm run seo:audit
