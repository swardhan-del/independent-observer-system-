name: Continuous integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint and type-check
        run: npm run lint
      - name: Test normal production output
        run: npm test
      - name: Build GitHub Pages output
        run: npm run build:pages
      - name: Test GitHub Pages output
        run: npm run test:built
      - name: Build approved public-origin output
        run: SITE_URL=https://independentobserver.org BASE_PATH=/ npm run build
      - name: Run SEO audit
        run: SEO_SITE_URL=https://independentobserver.org npm run seo:audit
